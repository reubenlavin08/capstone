<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="dots" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="28" cy="28" r="0.7" fill="#1f1f1f"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- 3 short, thick traces — punctuation, not rails -->
  <g stroke="#8a8a8a" stroke-width="6" fill="none" stroke-linecap="round">
    <!-- top-left stub -->
    <path d="M 0 240 L 220 240 L 290 310 L 380 310"/>
    <!-- bottom-right stub -->
    <path d="M 1920 840 L 1700 840 L 1630 770 L 1540 770"/>
    <!-- top-right short -->
    <path d="M 1920 200 L 1740 200 L 1680 260 L 1600 260"/>
  </g>

  <!-- vias at trace endpoints -->
  <g fill="#b0b0b0">
    <circle cx="380" cy="310" r="9"/>
    <circle cx="1540" cy="770" r="9"/>
    <circle cx="1600" cy="260" r="9"/>
  </g>
</svg>
